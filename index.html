<!DOCTYPE html>
<html>
<head>
    <title>Smart Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Smart Study Planner</h1>
    <p>Plan your day. Track your goals.</p>

    <h2>Today's Progress</h2>

    <p id="percentage">0% Completed</p>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <p id="count">0 of 3 tasks completed</p>

    <h2>Today's Study Tasks</h2>

    <p>
        <input type="checkbox" onchange="updateProgress()">
        Study Java
    </p>

    <p>
        <input type="checkbox" onchange="updateProgress()">
        Practice Python
    </p>

    <p>
        <input type="checkbox" onchange="updateProgress()">
        Revise college subjects
    </p>

    <button onclick="resetTasks()">Reset Tasks</button>

    <script src="script.js"></script>

</body>
</html>
