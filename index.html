
<!DOCTYPE html>
<html>
<head>
    <title>Smart Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Smart Study Planner</h1>
    <p>Plan your day. Track your goals.</p>

    <h2>Today's Progress</h2>
    <p id="percentage">0% Completed</p>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <p id="count">0 of 0 tasks completed</p>

    <h2>Add a Study Task</h2>

    <input type="text" id="taskInput"
           placeholder="Enter your study task">

    <br><br>

    <label for="subjectInput">Choose Subject:</label>

    <select id="subjectInput">
        <option value="Java">Java</option>
        <option value="Python">Python</option>
        <option value="College">College Subjects</option>
        <option value="Other">Other</option>
    </select>

    <br><br>

    <label for="deadlineInput">Deadline:</label>

    <input type="date" id="deadlineInput">

    <br><br>

    <button onclick="addTask()">Add Task</button>

    <h2>Today's Study Tasks</h2>

    <div id="taskList"></div>

    <button onclick="resetTasks()">Reset Tasks</button>

    <script src="script.js"></script>

</body>
</html>
